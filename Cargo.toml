[workspace]
members = ["crates/wtm-core", "crates/wtm", "crates/window-win"]
default-members = ["crates/wtm"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/konmik/worktree-monitor"

[workspace.dependencies]
wtm-core = { path = "crates/wtm-core" }
window-win = { path = "crates/window-win" }
