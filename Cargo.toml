[workspace]
members = ["crates/wtm-core", "crates/wtm", "crates/wtm-dashboard", "crates/wtm-terminal", "crates/wtm-windows"]
default-members = ["crates/wtm"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/konmik/worktree-monitor"

[workspace.dependencies]
wtm-core = { path = "crates/wtm-core" }
wtm-dashboard = { path = "crates/wtm-dashboard" }
wtm-terminal = { path = "crates/wtm-terminal" }
wtm-windows = { path = "crates/wtm-windows" }
