[package]
name = "wtm-gui-windows"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Native Windows dashboard for Worktree Monitor"

[dependencies]
wtm-ui.workspace = true
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Security", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }

[[test]]
name = "placement"
path = "src/features/window/window-position-survives-restart/placement.test.rs"

[[test]]
name = "opacity"
path = "src/features/context-menu/users-can-select-opacity-in-five-percent-steps/opacity.test.rs"
