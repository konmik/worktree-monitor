[package]
name = "wtm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "An always-on-top Windows dashboard for Git repositories and worktrees"
default-run = "wtm"

[dependencies]
clap = { version = "4", features = ["derive"] }
wtm-ui.workspace = true
fs2 = "0.4"
tempfile = "3"
wtm-tui.workspace = true

[target.'cfg(windows)'.dependencies]
wtm-gui-windows.workspace = true

[dev-dependencies]
dunce = "1"
serde_json = "1"

[build-dependencies]
embed-resource = "3.0.12"
